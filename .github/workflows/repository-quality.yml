name: Repository quality
on:
  push:
    branches: [main, arena/2bd55f92-wattwise]
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: Documentation links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check local links, assets and image alt text
        run: node .github/scripts/check-docs.mjs
