<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Wattwise — Know your power.</title>
  <desc id="desc">A dark violet Wattwise banner with a lightning mark and a decorative energy waveform. Local-first Windows battery insights.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18152d"/><stop offset="1" stop-color="#30204c"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#9574fc"/><stop offset="1" stop-color="#e7d1ff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d0b9ff" stroke-opacity=".05"/></pattern>
    <radialGradient id="glow"><stop stop-color="#a67aff" stop-opacity=".3"/><stop offset="1" stop-color="#a67aff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)"/>
  <ellipse cx="1000" cy="230" rx="310" ry="300" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="58" width="46" height="46" rx="14" fill="#9973ed"/>
    <path d="M89 65 76 84h10l-3 14 17-22H88Z" fill="#fff"/>
    <text x="126" y="92" fill="#fff" font-size="34" font-weight="700" letter-spacing="-1">wattwise<tspan fill="#c2a3ff">.</tspan></text>
    <text x="66" y="161" fill="#c7aefc" font-size="12" font-weight="700" letter-spacing="3">LESS GUESSWORK. MORE AWARENESS.</text>
    <text x="62" y="242" fill="#fff" font-size="68" font-weight="750" letter-spacing="-3">Know your power.</text>
    <text x="65" y="291" fill="#c7bdd9" font-size="21">Battery insights. Charging diagnostics.</text>
    <text x="65" y="324" fill="#c7bdd9" font-size="21">A clearer picture of your energy habits.</text>
    <g font-size="12" fill="#e8defa" text-anchor="middle" font-weight="600">
      <rect x="65" y="368" width="137" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/><text x="133" y="389">LOCAL-FIRST</text>
      <rect x="212" y="368" width="142" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/><text x="283" y="389">WINDOWS 11</text>
      <rect x="364" y="368" width="130" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/><text x="429" y="389">NO ACCOUNT</text>
    </g>
    <text x="65" y="464" fill="#998aaa" font-size="12" letter-spacing="1">BUILT WITH ELECTRON + REACT</text>
    <text x="1215" y="464" fill="#998aaa" text-anchor="end" font-size="12">Battery power ≠ wall power</text>
  </g>
  <g transform="translate(875 130)">
    <circle cx="112" cy="108" r="104" fill="none" stroke="#c6a4ff" stroke-opacity=".15"/>
    <circle cx="112" cy="108" r="82" fill="#ffffff" fill-opacity=".025" stroke="#c6a4ff" stroke-opacity=".22"/>
    <path d="m119 50-49 68h38l-8 53 60-79h-42l13-42Z" fill="#c7a5ff"/>
  </g>
  <path d="M798 345h35l18-24 20 48 24-61 27 37h32l23-23 19 41 26-65 27 47h33l21-22 18 35 26-53 25 40h35" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
